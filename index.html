<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fbf6ec" />
    <meta name="description" content="Un millón de gracias a Mariángeles." />
    <title>Un millón de gracias · Mariángeles</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — by Rafael Pedicini (MIT)
      // https://github.com/rafgraph/spa-github-pages
      //
      // Complemento a public/404.html. Tras la redirección desde 404.html
      // a /unmillondegracias/?/<ruta>, este script decodifica la query y
      // restaura la URL real con history.replaceState ANTES de que React
      // Router lea la ruta. Sin esto, /admin daría 404 en GitHub Pages.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
