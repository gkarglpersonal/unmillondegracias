    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — by Rafael Pedicini (MIT)
      // https://github.com/rafgraph/spa-github-pages
      //
      // Complemento a public/404.html. Tras la redirección desde 404.html
      // a /?/<ruta>, este script decodifica la query y restaura la URL
      // real con history.replaceState ANTES de que React Router monte.
      //
      // Guards anti-loop:
      //  - Solo ejecuta si l.search tiene contenido y empieza por "?/"
      //    (el patrón generado por 404.html).
      //  - Aborta si la URL actual ya contiene "/~and~/" (síntoma de
      //    redirección corrupta o loop previo).
      (function (l) {
        var hasExpectedPattern =
          typeof l.search === 'string' &&
          l.search.length > 1 &&
          l.search.charAt(1) === '/';

        var looksLikeLoop =
          l.pathname.indexOf('/~and~/') !== -1 ||
          l.search.indexOf('/~and~/') !== -1;

        if (!hasExpectedPattern || looksLikeLoop) return;

        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) { return s.replace(/~and~/g, '&'); })
          .join('?');

        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      })(window.location);
    </script>
