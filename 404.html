<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Un millón de gracias · MªÁngeles</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — by Rafael Pedicini (MIT)
      // https://github.com/rafgraph/spa-github-pages
      //
      // Captura la ruta solicitada y redirige a la raíz de la app con la
      // ruta como query, para que el script complementario en index.html
      // restaure la URL real con history.replaceState.
      //
      // pathSegmentsToKeep = 0 porque la app sirve desde la raíz del
      // dominio personalizado (unmillondegracias.com). Si en el futuro
      // se vuelve a publicar bajo /unmillondegracias/ (gkarglpersonal.github.io),
      // cambiar a 1.
      (function () {
        var l = window.location;

        // Safety: si la URL ya contiene "~and~" (síntoma de loop por una
        // redirección previa mal configurada), ir a la raíz limpia.
        if (/~and~/.test(l.pathname)) {
          l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/'
          );
          return;
        }

        var pathSegmentsToKeep = 0;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
